jwt_algorithm: HS256
jwt_secret: enter-a-secret
log_dir: /var/log/mash/
encryption_keys_file: /var/lib/mash/encryption_keys
ssh_private_key_file: /var/lib/mash/ssh_key
amqp_host: localhost
amqp_user: guest
amqp_pass: guest
smtp_host: localhost
smtp_port: 25
smtp_ssl: False
smtp_user: test@fake.com
credentials_url: http://localhost:5006/
database_api_url: http://localhost:5007/
database_uri: sqlite:////var/lib/mash/app.db
download_directory: /var/lib/mash/images
services:
  - download
  - upload
  - create
  - test_preparation
  - test
  - test_cleanup
  - raw_image_upload
  - replicate
  - publish
  - deprecate
credentials:
  credentials_directory: /var/lib/mash/credentials/
cloud:
  ec2:
    regions:
      aws:
        - af-south-1
        - ap-east-1
        - ap-northeast-1
        - ap-northeast-2
        - ap-south-1
        - ap-southeast-1
        - ap-southeast-2
        - ap-southeast-3
        - ca-central-1
        - eu-central-1
        - eu-north-1
        - eu-south-1
        - eu-west-1
        - eu-west-2
        - eu-west-3
        - il-central-1
        - me-central-1
        - me-south-1
        - sa-east-1
        - us-east-1
        - us-east-2
        - us-west-1
        - us-west-2
      aws-cn:
        - cn-north-1
        - cn-northwest-1
      aws-us-gov:
        - us-gov-east-1
        - us-gov-west-1
      aws-eusc:
        - eusc-de-east-1
    test_instance_catalog:
    - region: us-east-1
      partition: aws
      arch: x86_64
      instance_types:
      - c5.large
      - m5.large
      - t3.small
      boot_types:
        - uefi-preferred
        - uefi
      cpu_options: []
    - region: us-east-1
      arch: x86_64
      partition: aws
      instance_types:
      - i3.large
      - t2.small
      boot_types:
        - bios
      cpu_options: []
    - region: us-east-2
      partition: aws
      arch: x86_64
      instance_types:
      - m6a.large
      - c6a.large
      - r6a.large
      boot_types:
      - uefi-preferred
      - uefi
      cpu_options:
      - AmdSevSnp_enabled
    - region: us-east-1
      partition: aws
      arch: aarch64
      instance_types:
      - t4g.small
      - m6g.medium
      boot_types:
      - uefi
      - uefi-preferred
      cpu_options: []
    - region: cn-north-1
      partition: aws-cn
      arch: x86_64
      instance_types:
      - t3.small
      boot_types:
        - bios
      cpu_options: []
    - region: cn-north-1
      partition: aws-cn
      arch: x86_64
      instance_types:
      - m5.large
      - t3.small
      boot_types:
        - uefi-preferred
        - uefi
      cpu_options: []
    - region: cn-north-1
      partition: aws-cn
      arch: aarch64
      instance_types:
      - t4g.small
      boot_types:
      - uefi
      - uefi-preferred
      cpu_options: []
    - region: us-gov-east-1
      partition: aws-us-gov
      arch: x86_64
      instance_types:
      - i3.large
      - t3.small
      boot_types:
        - bios
      cpu_options: []
    - region: us-gov-east-1
      partition: aws-us-gov
      arch: x86_64
      instance_types:
      - c5.large
      - m5.large
      - t3.small
      boot_types:
        - uefi-preferred
        - uefi
      cpu_options: []
    - region: us-gov-east-1
      partition: aws-us-gov
      arch: aarch64
      instance_types:
      - t4g.small
      boot_types:
      - uefi
      - uefi-preferred
      cpu_options: []
    instance_feature_additional_tests:
      AmdSev_enabled:
        - test_sles_sev
      AmdSevSnp_enabled:
        - test_sles_sev_snp
      IntelTdx_enabled:
        - test_sles_tdx
    max_instance_tests: 3
  gce:
    test_instance_catalog:
    - region: us-east1-c
      test_fallback_regions:
      - us-east1-b
      - us-east4-a
      arch: X86_64
      instance_types:
      - n1-standard-1
      - n1-highmem-2
      - n1-highcpu-2
      boot_types:
        - uefi
      shielded_vm:
        - securevm_enabled
      nic:
        - gvnic_enabled
      confidential_compute: []
    - region: us-central1-a
      test_fallback_regions:
      - us-central1-b
      - us-east1-b
      arch: X86_64
      instance_types:
      - n2d-standard-2
      boot_types:
        - uefi
      shielded_vm:
        - securevm_enabled
      nic:
        - gvnic_enabled
      confidential_compute:
        - AmdSevSnp_enabled
        - AmdSev_enabled
    - region: us-east1-d
      test_fallback_regions:
      - us-east1-b
      - us-east1-c
      arch: X86_64
      instance_types:
      - c4d-standard-4
      - c3d-standard-4
      boot_types:
        - uefi
      shielded_vm:
        - securevm_enabled
      nic:
        - gvnic_enabled
      confidential_compute:
        - AmdSev_enabled
    - region: us-central1-a
      test_fallback_regions:
      - us-central1-b
      - us-central1-c
      arch: X86_64
      instance_types:
      - c3-standard-4
      boot_types:
        - uefi
      shielded_vm:
        - securevm_enabled
      nic:
        - gvnic_enabled
      confidential_compute:
        - IntelTdx_enabled
    - region: us-central1-a
      test_fallback_regions:
      - us-central1-f
      - us-central1-b
      arch: ARM64
      instance_types:
      - t2a-standard-2
      boot_types:
        - uefi
      shielded_vm:
        - securevm_enabled
      nic:
        - gvnic_enabled
      confidential_compute: []
    instance_feature_additional_tests:
      AmdSev_enabled:
        - test_sles_sev
      AmdSevSnp_enabled:
        - test_sles_sev_snp
      IntelTdx_enabled:
        - test_sles_tdx
    max_instance_tests: 3
  aliyun:
    ignored_regions:
      - cn-fuzhou
test:
  img_proof_timeout: 600
download:
  additional_file_extensions:
    - cdx.json
    - spdx.json
    - packages
  additional_prefixed_files:
    ChangeLog.:
      - txt
      - json
upload:
  azure:
    max_retry_attempts: 5
    max_workers: 8
email_allowlist:
  emails@to.allow.com
domain_allowlist:
  suse.com
